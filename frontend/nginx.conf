server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: any path not matching a real file falls back to index.html
    # so React Router can handle it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets can be cached aggressively; index.html must not be,
    # so a new deploy is always picked up on next load.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
