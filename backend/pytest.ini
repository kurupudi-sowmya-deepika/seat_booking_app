[pytest]
# ---------------------------------------------------------------------------
# SpaceHub / SeatSync – pytest configuration
# ---------------------------------------------------------------------------
# Run from backend/:
#   pytest                          # all tests
#   pytest -m "not e2e"            # unit/schema-only (no DB needed)
#   pytest -m e2e                  # full end-to-end (requires seeded DB)
#   pytest tests/test_booking_null_branch.py   # single file
# ---------------------------------------------------------------------------

asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

testpaths = tests

# Markers used across the test suite
markers =
    e2e: End-to-end tests that require a running, seeded Postgres database
    unit: Pure unit/schema tests with no external dependencies
    auth: Authentication and authorization tests
    booking: Booking lifecycle tests
    chatbot: AI chatbot / LangGraph tests
    floor: Floor-plan management tests
    mcp: MCP server integration tests
    wallet: Wallet and payment tests

# Show local variables in tracebacks (great for debugging assert failures)
addopts =
    -v
    --tb=short
    --strict-markers

# Suppress asyncpg / sqlalchemy deprecation noise that isn't actionable
filterwarnings =
    ignore::DeprecationWarning:asyncpg
    ignore::DeprecationWarning:sqlalchemy
    ignore::PendingDeprecationWarning
